steps:
  # Build the application image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/statcalculator', '.']
  
  # Push the image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/statcalculator']
  
  # Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'korebaps-app'
      - '--image=gcr.io/$PROJECT_ID/statcalculator'
      - '--region=us-east4'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=4000'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--timeout=60s'
      - '--concurrency=80'
      - '--max-instances=100'
      - '--set-secrets'
      - 'DB_HOST=db-host:latest'
      - 'DB_PORT=db-port:latest'
      - 'DB_NAME=db-name:latest'
      - 'DB_USER=db-user:latest'
      - 'DB_PASSWORD=db-password:latest'
      - 'ADMIN_PASSWORD=admin-password:latest'
      - '--set-env-vars'
      - 'DB_SSL=true'
      - 'PORT=4000'
      - 'DB_SSL_CA=ca.pem'
      - 'DB_SSL_REJECT_UNAUTHORIZED=true'
      - 'REACT_APP_API_BASE_URL=https://korebaps-app-335189014297.us-east4.run.app'

availableSecrets:
  - secretManager:
      secretName: db-host
      version: latest
  - secretManager:
      secretName: db-port
      version: latest
  - secretManager:
      secretName: db-name
      version: latest
  - secretManager:
      secretName: db-user
      version: latest
  - secretManager:
      secretName: db-password
      version: latest
  - secretManager:
      secretName: admin-password
      version: latest

images:
  - 'gcr.io/$PROJECT_ID/statcalculator'
