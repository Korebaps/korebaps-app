<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="KOREBAPS Statistics Tracking"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>KOREBAPS</title>
    <style>
      #visitor-counter {
        font-size: 12px;
        color: #d1d5db;
        text-align: center;
        padding: 10px;
        font-family: monospace;
        background-color: #1f2937;
        border-top: 1px solid #374151;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <div id="visitor-counter"></div>
    <script>
      (function() {
        'use strict';

        var THROTTLE_KEY = 'korebaps_visitor_last_record';
        var SESSION_MS = 30 * 60 * 1000;

        function getFingerprint() {
          var raw = [
            navigator.userAgent,
            screen.width + 'x' + screen.height,
            screen.colorDepth,
            Intl.DateTimeFormat().resolvedOptions().timeZone
          ].join('|');
          var hash = 0;
          for (var i = 0; i < raw.length; i++) {
            hash = ((hash << 5) - hash) + raw.charCodeAt(i);
            hash |= 0;
          }
          return 'fp_' + Math.abs(hash).toString(36);
        }

        function showStats(stats) {
          var counter = document.getElementById('visitor-counter');
          if (counter) {
            counter.innerHTML = 'Today: ' + stats.today + ' | Month: ' + stats.month + ' | Total: ' + stats.total;
          }
        }

        function showError() {
          var counter = document.getElementById('visitor-counter');
          if (counter) {
            counter.innerHTML = 'Visitor stats unavailable';
          }
        }

        function shouldRecord() {
          try {
            var last = parseInt(localStorage.getItem(THROTTLE_KEY), 10);
            return !last || (Date.now() - last) > SESSION_MS;
          } catch (e) {
            return true;
          }
        }

        function markRecorded() {
          try { localStorage.setItem(THROTTLE_KEY, String(Date.now())); } catch (e) {}
        }

        function recordVisit() {
          var fingerprint = getFingerprint();
          fetch('/api/visitor/record', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ fingerprint: fingerprint })
          })
          .then(function(r) { return r.ok ? r.json() : Promise.reject(); })
          .then(function(stats) {
            markRecorded();
            showStats(stats);
          })
          .catch(function() { fetchStats(); });
        }

        function fetchStats() {
          fetch('/api/visitor/stats')
            .then(function(r) { return r.ok ? r.json() : Promise.reject(); })
            .then(showStats)
            .catch(showError);
        }

        if (shouldRecord()) {
          recordVisit();
        } else {
          fetchStats();
        }
      })();
    </script>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
