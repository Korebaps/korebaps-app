<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="KOREBAPS Statistics Tracking"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>KOREBAPS</title>
    <style>
      #visitor-counter {
        font-size: 12px;
        color: #d1d5db;
        text-align: center;
        padding: 10px;
        font-family: monospace;
        background-color: #1f2937;
        border-top: 1px solid #374151;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <div id="visitor-counter"></div>
    <script>
      (function() {
        'use strict';
        
        function getVisitorCount() {
          try {
            var storageKey = 'korebaps_visitor_stats';
            var data = localStorage.getItem(storageKey);
            if (!data) {
              data = JSON.stringify({
                total: 0,
                daily: {},
                monthly: {},
                lastVisit: 0
              });
            }
            return JSON.parse(data);
          } catch (e) {
            return { total: 0, daily: {}, monthly: {}, lastVisit: 0 };
          }
        }
        
        function saveVisitorCount(data) {
          try {
            var storageKey = 'korebaps_visitor_stats';
            localStorage.setItem(storageKey, JSON.stringify(data));
          } catch (e) {
            console.log('Could not save visitor data:', e);
          }
        }
        
        function updateCounter() {
          var data = getVisitorCount();
          var now = Date.now();
          var today = new Date().toDateString();
          var thisMonth = new Date().toISOString().slice(0, 7);
          
          // Check if this is a new visit (30 minute session timeout)
          var isNewVisit = !data.lastVisit || (now - data.lastVisit) > 30 * 60 * 1000;
          
          if (isNewVisit) {
            // Update total
            data.total = (data.total || 0) + 1;
            
            // Update daily
            if (!data.daily) data.daily = {};
            data.daily[today] = (data.daily[today] || 0) + 1;
            
            // Update monthly
            if (!data.monthly) data.monthly = {};
            data.monthly[thisMonth] = (data.monthly[thisMonth] || 0) + 1;
            
            // Update last visit
            data.lastVisit = now;
            
            saveVisitorCount(data);
          }
          
          // Display the counter
          var counter = document.getElementById('visitor-counter');
          if (counter) {
            var todayCount = data.daily[today] || 0;
            var monthCount = data.monthly[thisMonth] || 0;
            counter.innerHTML = 'Today: ' + todayCount + ' | Month: ' + monthCount + ' | Total: ' + data.total;
          }
        }
        
        // Update immediately and then every 30 seconds
        updateCounter();
        setInterval(updateCounter, 30000);
        
        // Also update when page becomes visible again
        document.addEventListener('visibilitychange', function() {
          if (!document.hidden) {
            updateCounter();
          }
        });
        
      })();
    </script>

      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
